<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur de Donjon — OSR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#ece0c3;
    --parchment-dark:#d9c69a;
    --parchment-shadow:#c1a978;
    --ink:#241a12;
    --ink-soft:#4a3928;
    --leather:#3c2a1a;
    --leather-dark:#1c1109;
    --leather-light:#5a4128;
    --red:#8c2f1f;
    --red-dark:#5f1f14;
    --red-light:#b04530;
    --gold:#a6791e;
    --gold-light:#d4ac4a;
    --line:#b9a173;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    height:100dvh; overflow:hidden;
    font-family:'EB Garamond', serif; color:var(--ink);
    background:linear-gradient(160deg, var(--leather-dark), var(--leather) 45%, var(--leather-dark));
  }
  button{font:inherit;}

  /* ====== disposition plein écran : barre d'outils + canvas ====== */
  .mapper-app{ height:100dvh; display:flex; flex-direction:column; }
  .mapper-toolbar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:10px 16px;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,250,230,0.5), transparent 55%),
      linear-gradient(135deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border-bottom:2px solid var(--gold);
    box-shadow:0 4px 10px rgba(0,0,0,.25);
    flex-wrap:wrap;
  }
  .mapper-toolbar .mapper-left{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .mapper-title{
    font-family:'Cinzel', serif; font-weight:700; letter-spacing:.04em;
    color:var(--red-dark); font-size:15px; white-space:nowrap;
    display:inline-flex; align-items:center;
  }
  .mapper-tools{ display:flex; align-items:center; gap:6px; }
  .mapper-tool{
    width:38px; height:36px; border:1px solid var(--gold); border-radius:8px;
    background:linear-gradient(135deg, var(--parchment), var(--parchment-dark));
    font-size:17px; cursor:pointer; line-height:1; color:var(--ink);
    display:inline-flex; align-items:center; justify-content:center;
    transition:filter .15s, transform .1s;
  }
  .mapper-tool svg{ width:20px; height:20px; display:block; pointer-events:none; }
  .mapper-tool:hover{ filter:brightness(1.06); transform:translateY(-1px); }
  .mapper-tool.active{ background:linear-gradient(135deg, var(--gold-light), #d9bd72); box-shadow:inset 0 0 0 2px var(--red-dark); color:var(--leather-dark); }
  #toolIcon{ width:auto; min-width:38px; padding:0 6px; gap:3px; }
  #toolIcon .cur-emoji{ font-size:15px; line-height:1; }
  #toolIcon .cur-emoji:empty{ display:none; }
  .drop-tool{ width:auto !important; min-width:38px; padding:0 5px 0 7px; gap:3px; }
  .drop-tool .cur-path{ display:inline-flex; }
  .drop-tool svg.caret{ width:9px; height:6px; opacity:.75; }
  .map-drop-menu{
    display:none; position:fixed; z-index:72; width:256px;
    background:linear-gradient(135deg, var(--parchment), var(--parchment-dark));
    border:2px solid var(--gold); border-radius:12px; padding:6px;
    box-shadow:0 18px 44px rgba(0,0,0,.5);
  }
  .map-drop-menu.show{ display:block; }
  .map-path-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:7px 9px; border:1px solid transparent; border-radius:8px; background:transparent;
    color:var(--ink); cursor:pointer;
  }
  .map-path-item + .map-path-item{ margin-top:3px; }
  .map-path-sep{
    display:flex; align-items:center; gap:8px; margin:8px 4px 5px;
    font-family:'Cinzel', serif; font-weight:700; font-size:11px; letter-spacing:.08em; color:var(--gold);
  }
  .map-path-sep::before, .map-path-sep::after{ content:''; flex:1; height:1px; background:var(--gold); opacity:.7; }
  .map-path-item:hover{ background:rgba(255,252,240,.6); border-color:var(--line); }
  .map-path-item.active{ background:linear-gradient(135deg, var(--gold-light), #d9bd72); box-shadow:inset 0 0 0 2px var(--red-dark); }
  .map-path-item .pi{ width:34px; height:34px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:7px; background:rgba(255,252,240,.7); }
  .map-path-item.active .pi{ border-color:var(--red-dark); }
  .map-path-item .pi svg{ width:20px; height:20px; }
  .map-path-item .pl{ font-family:'Cinzel', serif; font-weight:700; font-size:14px; color:var(--red-dark); line-height:1.15; display:flex; flex-direction:column; }
  .map-path-item .pl small{ font-family:'EB Garamond', serif; font-weight:400; font-style:italic; font-size:13px; color:var(--ink-soft); }
  #toolSvg{ width:auto; min-width:38px; padding:0 6px; gap:3px; }
  #toolSvg .cur-svg svg{ width:16px; height:16px; }
  #toolSvg .cur-svg:empty{ display:none; }
  .mapper-width{
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--parchment), var(--parchment-dark));
    border:1px solid var(--gold); border-radius:8px;
    padding:5px 10px; color:var(--ink-soft); font-size:13px;
  }
  .mapper-width label{ font-family:'Special Elite', monospace; white-space:nowrap; }
  .mapper-width input[type=range]{ width:120px; accent-color:var(--red); cursor:pointer; }
  .mapper-width #mapWidthDisplay{ min-width:26px; text-align:right; font-weight:700; color:var(--red-dark); }
  .mapper-right{ display:flex; align-items:center; gap:8px; }
  .mapper-btn{
    border:1px solid var(--gold);
    background:linear-gradient(135deg, var(--parchment), var(--parchment-dark));
    color:var(--red-dark);
    font-family:'Cinzel', serif; font-weight:700; font-size:14px;
    height:36px; min-width:38px; padding:0 12px; border-radius:8px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:filter .15s, transform .1s;
  }
  .mapper-btn svg{ width:18px; height:18px; display:block; pointer-events:none; }
  .mapper-btn:hover{ filter:brightness(1.06); transform:translateY(-1px); }
  .mapper-btn.danger{ color:var(--red); }
  .mapper-btn.primary{ background:linear-gradient(135deg, var(--red), var(--red-dark)); color:var(--parchment); }

  .mapper-canvas-wrap{
    flex:1 1 auto; min-height:0; overflow:hidden; position:relative;
    background:
      linear-gradient(var(--parchment-shadow) 1px, transparent 1px),
      linear-gradient(90deg, var(--parchment-shadow) 1px, transparent 1px),
      linear-gradient(135deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    background-size:20px 20px, 20px 20px, 100% 100%;
  }
  .mapper-canvas-wrap{ scrollbar-width:none; -ms-overflow-style:none; }
  .mapper-canvas-wrap::-webkit-scrollbar{ width:0; height:0; display:none; }
  #dungeonCanvas{ display:block; background:transparent; cursor:crosshair; touch-action:none; }

  /* menu des tampons d'icônes */
  #mapIconMenu, #mapSvgMenu{
    display:none; position:fixed; z-index:72;
    width:min(340px, 92vw); max-height:70vh; overflow-y:auto;
    background:linear-gradient(135deg, var(--parchment), var(--parchment-dark));
    border:2px solid var(--gold); border-radius:12px; padding:8px 10px;
    box-shadow:0 18px 44px rgba(0,0,0,.5);
  }
  #mapIconMenu.show, #mapSvgMenu.show{ display:block; }
  #mapIconMenu .cat-title, #mapSvgMenu .cat-title{
    font-family:'Cinzel', serif; font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--red-dark); margin:8px 2px 5px; padding-bottom:3px; border-bottom:1px solid var(--gold);
  }
  #mapIconMenu .cat-title:first-child, #mapSvgMenu .cat-title:first-child{ margin-top:2px; }
  #mapIconMenu .cat-grid, #mapSvgMenu .cat-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:5px; margin-bottom:2px; }
  /* barre de défilement discrète au thème */
  #mapIconMenu, #mapSvgMenu{ scrollbar-width:thin; scrollbar-color:var(--gold) transparent; }
  #mapIconMenu::-webkit-scrollbar, #mapSvgMenu::-webkit-scrollbar{ width:8px; }
  #mapIconMenu::-webkit-scrollbar-thumb, #mapSvgMenu::-webkit-scrollbar-thumb{ background:var(--gold); border-radius:8px; }
  .map-icon-btn{
    width:44px; height:44px; border:1px solid var(--line); border-radius:8px;
    background:rgba(255,252,240,.7); font-size:22px; cursor:pointer; line-height:1;
    display:inline-flex; align-items:center; justify-content:center;
    transition:filter .12s, transform .1s;
  }
  .map-icon-btn:hover{ filter:brightness(1.05); transform:scale(1.08); background:var(--gold-light); }
  .map-icon-btn svg{ width:30px; height:30px; display:block; pointer-events:none; }

  /* champ texte flottant */
  .map-text-input{
    position:absolute; z-index:5;
    font-family:'Special Elite', monospace; font-size:18px; line-height:1.22; color:var(--ink);
    background:rgba(255,252,240,.94); border:1px dashed var(--red);
    border-radius:4px; padding:2px 4px; min-width:80px; outline:none;
    resize:none; overflow:hidden; white-space:pre;
  }

  /* modale de confirmation */
  #mapOverlay{ display:none; position:fixed; inset:0; z-index:70; background:rgba(20,12,6,.45); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #mapModal{
    display:none; position:fixed; z-index:71; top:50%; left:50%; transform:translate(-50%,-50%);
    min-width:280px; max-width:90vw;
    background:linear-gradient(135deg, var(--parchment), var(--parchment-dark));
    border:2px solid var(--gold); border-radius:12px;
    box-shadow:0 25px 60px rgba(0,0,0,.5);
    padding:22px 24px; text-align:center; color:var(--ink);
  }
  #mapModal h2{ font-family:'Cinzel', serif; color:var(--red-dark); margin:0 0 10px; font-size:19px; }
  #mapModal p{ margin:0 0 18px; color:var(--ink-soft); font-family:'EB Garamond', serif; font-size:15px; }
  #mapModal .map-modal-actions{ display:flex; justify-content:center; gap:12px; }

  @media (pointer:coarse){
    .mapper-tool{ width:42px; height:40px; }
    .map-icon-btn{ width:50px; height:50px; }
  }
  @media (max-width:640px){
    .mapper-toolbar{ padding:8px 12px; gap:10px; }
    .mapper-width input[type=range]{ width:92px; }
    .mapper-title{ font-size:14px; }
  }
</style>
</head>
<body>
  <div class="mapper-app">
    <div class="mapper-toolbar">
      <div class="mapper-left">
        <span class="mapper-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;vertical-align:-3px;margin-right:5px"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Carte</span>
        <div class="mapper-tools">
          <button class="mapper-tool drop-tool active" id="toolPath" title="Tracés : chemin, eau, feuillage"><span class="cur-path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h11a5 5 0 0 1 5 5v11"/><path d="M3 11h8a2 2 0 0 1 2 2v8"/></svg></span><svg class="caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></button>
          <button class="mapper-tool drop-tool" id="toolNote" title="Annotations : texte, flèche"><span class="cur-path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></span><svg class="caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></button>
          <button class="mapper-tool" id="toolIcon" title="Icône (choisir puis placer)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-6 6.5-10.5A6.5 6.5 0 0 0 5.5 10.5C5.5 15 12 21 12 21z"/><circle cx="12" cy="10.3" r="2.3"/></svg><span class="cur-emoji"></span></button>
          <button class="mapper-tool" id="toolSvg" title="Pictogramme (choisir puis placer — taille = curseur Largeur)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M7 16l3.5-4.5 2.5 3 2-2.5L17 16"/><circle cx="15.5" cy="8.5" r="1.4"/></svg><span class="cur-svg"></span></button>
          <button class="mapper-tool" id="toolEraser" data-tool="eraser" title="Gomme (cliquer un élément pour l'effacer)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.5l6.5-6.5 6 6-5.5 5.5H8z"/><path d="M8.5 19.5H19"/><path d="M9.5 9l6 6"/></svg></button>
        </div>
        <div class="mapper-width">
          <label for="mapWidthPicker">Largeur</label>
          <input type="range" id="mapWidthPicker" min="20" max="150" value="40">
          <span id="mapWidthDisplay">40</span>
        </div>
      </div>
      <div class="mapper-right">
        <button class="mapper-btn" id="mapUndoBtn" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
        <button class="mapper-btn danger" id="mapClearBtn" title="Tout effacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
        <button class="mapper-btn primary" id="mapSaveBtn" title="Exporter en PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg>PNG</button>
      </div>
    </div>
    <div class="mapper-canvas-wrap" id="mapperCanvasWrap">
      <canvas id="dungeonCanvas"></canvas>
    </div>
  </div>

    var bw=tw+padX*2, bh=lines.length*lh+padY*2;
    roundRectPath(c, obj.x, obj.y, bw, bh, r);
    c.fillStyle=PARCHMENT_COLOR; c.fill();
    c.lineWidth=LINE_FINE; c.strokeStyle=INK_COLOR; c.stroke();
    c.fillStyle=INK_COLOR;
    for(var j=0;j<lines.length;j++){ c.fillText(lines[j], obj.x+padX, obj.y+padY+j*lh); }
    c.restore();
  }

  /* ---- aperçu d'un objet actif ---- */
  /* ---- FEUILLAGE : touffes rondes qui se chevauchent (forêt OSR) ---- */
  function foliageClumps(pts, w){
    // place des centres régulièrement le long de la polyligne, pas <= rayon*0.55
    var r=w/2, step=Math.max(6, r*0.55), out=[], i, acc=0;
    if(!pts.length) return out;
    out.push({x:pts[0].x, y:pts[0].y});
    for(i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i], dx=b.x-a.x, dy=b.y-a.y, seg=Math.hypot(dx,dy);
      if(seg<1e-6) continue;
      var d=step-acc;
      while(d<seg){ out.push({x:a.x+dx*(d/seg), y:a.y+dy*(d/seg)}); d+=step; }
      acc=(seg-(d-step));
    }
    var last=pts[pts.length-1];
    if(Math.hypot(last.x-out[out.length-1].x, last.y-out[out.length-1].y) > step*0.5) out.push({x:last.x, y:last.y});
    return out;
  }
  // pseudo-hasard DÉTERMINISTE à partir des coordonnées (stable entre rendus et après save/load)
  function seeded(x,y){ var n=Math.sin(x*12.9898 + y*78.233)*43758.5453; return n-Math.floor(n); }
  // touffe IRRÉGULIÈRE en lobes de feuilles : rayon modulé par angle (bosses pointues) + jitter déterministe
  function leafBlobPath(c, cx, cy, base){
    var phase = seeded(cx, cy)*Math.PI*2;
    var lobes = 7 + Math.floor(seeded(cx*0.7, cy*1.3)*4);   // 7..10 lobes
    var steps = lobes*5;                                     // assez de points pour des pointes nettes
    for(var s=0;s<=steps;s++){
      var t = s/steps * Math.PI*2;
      // bosses principales (lobes) + harmonique + petit bruit positionnel = bord "feuillu"
      var wob = 0.20*Math.sin(t*lobes + phase)
              + 0.09*Math.sin(t*(lobes*2+1) - phase*1.7)
              + (seeded(cx + Math.cos(t)*9.1, cy + Math.sin(t)*9.1) - 0.5)*0.16;
      var rr = base*(1 + wob);
      var x = cx + Math.cos(t)*rr, y = cy + Math.sin(t)*rr;
      if(s===0) c.moveTo(x,y); else c.lineTo(x,y);
    }
    c.closePath();
  }
  /* Feuillage et eau sont peints en PASSES GLOBALES (comme les couloirs) :
     tous les contours d'abord, puis tous les remplissages par-dessus → les tracés qui se croisent fusionnent. */
  function foliageRadAt(r,x,y){ return r*(0.70 + seeded(x,y)*0.28); }
  function foliageGeom(o){
    if(!o.points||!o.points.length) return null;
    var r=o.width/2; return { r:r, clumps:foliageClumps(o.points, o.width) };
  }
  function foliageStage(c,g,stage){
    var i,a;
    if(stage===1){        // 1) contour encre de toutes les touffes
      c.strokeStyle=INK_COLOR; c.lineWidth=LINE_W*2;   // moitié recouverte par le vert → LINE_W visible
      for(i=0;i<g.clumps.length;i++){ a=g.clumps[i]; c.beginPath(); leafBlobPath(c, a.x, a.y, foliageRadAt(g.r,a.x,a.y)); c.stroke(); }
    } else if(stage===2){ // 2) remplissage vert : couvre tous les arcs internes, ne garde que le bord extérieur festonné
      c.fillStyle=FOLIAGE_FILL;
      for(i=0;i<g.clumps.length;i++){ a=g.clumps[i]; c.beginPath(); leafBlobPath(c, a.x, a.y, foliageRadAt(g.r,a.x,a.y)); c.fill(); }

    }
  }
  function foliagePass(c,list){
    var gs=[], i, st;
    for(i=0;i<list.length;i++){ var g=foliageGeom(list[i]); if(g) gs.push(g); }
    if(!gs.length) return;
    c.save(); c.globalCompositeOperation='source-over'; c.lineJoin='round'; c.lineCap='round';
    for(st=1;st<=2;st++){ for(i=0;i<gs.length;i++) foliageStage(c,gs[i],st); }
    c.restore();
  }
  function paintFoliage(c,o){ foliagePass(c,[o]); }

  /* ---- RIVIÈRE : berges encre + eau + reflet, sans hachures (fusion entre tracés) ---- */
  function riverPass(c,list){
    var rs=[], i; for(i=0;i<list.length;i++){ if(list[i].points && list[i].points.length>=2) rs.push(list[i]); }
    if(!rs.length) return;
    c.save(); c.lineCap='round'; c.lineJoin='round'; c.globalCompositeOperation='source-over';
    for(i=0;i<rs.length;i++){ corridorPath(c,rs[i].points); c.lineWidth=rs[i].width+LINE_W*2; c.strokeStyle=INK_COLOR; c.stroke(); }   // toutes les berges
    for(i=0;i<rs.length;i++){ corridorPath(c,rs[i].points); c.lineWidth=rs[i].width; c.strokeStyle=WATER_FILL; c.stroke(); }  // toute l'eau par-dessus
    var wp=c.createPattern(waveTile,'repeat');
    if(wp){                                                     // vaguelettes : un seul tracé par largeur → trame continue
      var byW={}; for(i=0;i<rs.length;i++){ (byW[rs[i].width]=byW[rs[i].width]||[]).push(rs[i]); }
      Object.keys(byW).forEach(function(w){
        c.beginPath();
        byW[w].forEach(function(o){ c.moveTo(o.points[0].x,o.points[0].y); for(var k=1;k<o.points.length;k++) c.lineTo(o.points[k].x,o.points[k].y); });
        c.lineWidth=+w; c.strokeStyle=wp; c.stroke();
      });
    }
    c.restore();
  }
  function paintRiver(c,o){ riverPass(c,[o]); }

  /* ---- PRAIRIE : aplat vert-paille + touffes d'herbes hautes sur une GRILLE MONDE commune
     → deux zones qui se chevauchent partagent les mêmes touffes : fusion parfaite, pas de double densité ---- */
  var GRASS_STEP = 24;                         // pas de la grille des touffes
  /* cellules d'une grille MONDE (pas « step ») couvertes par un tracé peint — partagées par tous les tracés du même type */
  var gridCache = (typeof WeakMap!=='undefined') ? new WeakMap() : null;
  function gridCells(o, step, margin, salt){
    var pts=o.points, n=pts.length, ck=step+':'+salt, all=gridCache && gridCache.get(o);
    if(all && all[ck] && all[ck].n===n && all[ck].w===o.width) return all[ck].cells;
    var cells={}, r=o.width/2, lim=r-margin, i, gx, gy;
    for(i=0;i<n;i++){
      var a=pts[i], b=pts[i+1]||a;
      var x0=Math.floor((Math.min(a.x,b.x)-r)/step), x1=Math.ceil((Math.max(a.x,b.x)+r)/step);
      var y0=Math.floor((Math.min(a.y,b.y)-r)/step), y1=Math.ceil((Math.max(a.y,b.y)+r)/step);
      for(gx=x0;gx<=x1;gx++) for(gy=y0;gy<=y1;gy++){

        var px=(gx+(seeded(gx*1.31+salt,gy*0.77)-0.5)*0.8)*step, py=(gy+(seeded(gy*1.13,gx*0.59+salt)-0.5)*0.8)*step;
        if(distToSeg({x:px,y:py},a,b)<=lim) cells[key]={x:px,y:py};

    return cells;
  }
  function meadowTufts(o){ return gridCells(o, GRASS_STEP, 2, 0); }
  function paintTuft(c,t){
    var s1=seeded(t.x,t.y), blades=3+Math.floor(s1*3);
    for(var k=0;k<blades;k++){
      var sk=seeded(t.x+k*3.7, t.y-k*2.3);
      var bx=t.x+(sk-0.5)*7, L=9+seeded(t.y+k, t.x-k)*8;                 // herbes HAUTES : 9 à 17
      var lean=0.32+(seeded(t.x*0.5+k, t.y*0.5)-0.5)*0.6;                 // couchées par le vent, vers la droite
      c.moveTo(bx,t.y);
      c.quadraticCurveTo(bx+lean*L*0.15, t.y-L*0.65, bx+lean*L, t.y-L);
    }
  }
  function meadowPass(c,list){
    var ms=[], i, k; for(i=0;i<list.length;i++){ if(list[i].points && list[i].points.length) ms.push(list[i]); }
    if(!ms.length) return;
    c.save(); c.globalCompositeOperation='source-over'; c.lineCap='round'; c.lineJoin='round';
    c.fillStyle=MEADOW_FILL; c.strokeStyle=MEADOW_FILL;                  // 1) aplat (sans contour : sol doux)
    for(i=0;i<ms.length;i++){
      var pts=ms[i].points;
      if(pts.length===1){ c.beginPath(); c.arc(pts[0].x,pts[0].y,ms[i].width/2,0,Math.PI*2); c.fill(); }
      else { corridorPath(c,pts); c.lineWidth=ms[i].width; c.stroke(); }
    }
    var all={};                                                           // 2) touffes : union des cellules
    for(i=0;i<ms.length;i++){ var cl=meadowTufts(ms[i]); for(k in cl) all[k]=cl[k]; }
    c.strokeStyle=MEADOW_GRASS; c.lineWidth=LINE_FINE;
    c.beginPath(); for(k in all){ var tf=all[k]; if(seeded(tf.x*0.61,tf.y*0.83)<0.65) paintTuft(c,tf); } c.stroke();   // ~2 cases sur 3 : touffes éparses
    c.restore();
  }
  function paintMeadow(c,o){ meadowPass(c,[o]); }

  /* ---- DÉSERT : aplat de sable + grains fins (grille monde commune → fusion sans raccord) ---- */
  var SAND_GRAIN_STEP = 9;
  function desertPass(c,list){
    var ds=[], i, k; for(i=0;i<list.length;i++){ if(list[i].points && list[i].points.length) ds.push(list[i]); }
    if(!ds.length) return;
    c.save(); c.globalCompositeOperation='source-over'; c.lineCap='round'; c.lineJoin='round';
    c.fillStyle=SAND_FILL; c.strokeStyle=SAND_FILL;                     // 1) aplat de sable, sans contour
    for(i=0;i<ds.length;i++){
      var pts=ds[i].points;
      if(pts.length===1){ c.beginPath(); c.arc(pts[0].x,pts[0].y,ds[i].width/2,0,Math.PI*2); c.fill(); }
      else { corridorPath(c,pts); c.lineWidth=ds[i].width; c.stroke(); }
    }
    var grains={};
    for(i=0;i<ds.length;i++){
      var g=gridCells(ds[i], SAND_GRAIN_STEP, 1, 3); for(k in g) grains[k]=g[k];
    }
    c.fillStyle=SAND_GRAIN; c.beginPath();                               // 2) grains de sable épars
    for(k in grains){ var p=grains[k]; if(seeded(p.x*2.1,p.y*1.7)<0.55){ var rr=0.6+seeded(p.y,p.x)*0.6; c.moveTo(p.x+rr,p.y); c.arc(p.x,p.y,rr,0,Math.PI*2); } }
    c.fill();
    c.restore();
  }
  function paintDesert(c,o){ desertPass(c,[o]); }

  /* ---- PLANCHER : motif de lames de bois tuilé dans l'espace MONDE (fusion parfaite, pas de raccord) ---- */
  /* style « encre » : fond parchemin à peine teinté, rainures et raccords à l'encre, quelques traits de veinage */
  var WOOD_FILL='#e4d5b1';
  var woodTile=null, WOOD_TS=2;                                       // tuile dessinée en x2 pour rester nette au zoom
  function buildWoodTile(){
    var TW=200, TH=80, BH=16, S=WOOD_TS;                              // 5 lames de 16 de haut, tuile 200 × 80
    woodTile=document.createElement('canvas'); woodTile.width=TW*S; woodTile.height=TH*S;
    var t=woodTile.getContext('2d'); t.scale(S,S);
    t.fillStyle=WOOD_FILL; t.fillRect(0,0,TW,TH);
    var offs=[0,120,52,160,86];                                       // raccords décalés d'une lame à l'autre
    t.strokeStyle=INK_COLOR; t.lineCap='round';
    for(var r=0;r<5;r++){
      var y=r*BH;
      t.lineWidth=LINE_FINE;                                          // rainure entre deux lames
      t.beginPath(); t.moveTo(0,y); t.lineTo(TW,y); t.stroke();
      t.lineWidth=LINE_FINE*0.9;                                      // raccord de bout de lame
      var jx=offs[r]; t.beginPath(); t.moveTo(jx,y); t.lineTo(jx,y+BH); t.stroke();
      t.lineWidth=0.7; t.globalAlpha=0.55;                            // 2 ou 3 traits de veinage, courts et sobres
      for(var g=0; g<3; g++){
        var gx=(offs[r]+18+g*58+seeded(r*2.3,g*1.9)*20)%TW, gy=y+5+seeded(g*3.1,r*1.3)*6, gl=14+seeded(r,g)*18;
        if(gx+gl>TW) gx=TW-gl-2;
        t.beginPath(); t.moveTo(gx,gy); t.quadraticCurveTo(gx+gl*0.5, gy-1, gx+gl, gy); t.stroke();
      }
      t.globalAlpha=1;
    }
  }
  function woodPass(c,list){
    var ws=[], i; for(i=0;i<list.length;i++){ if(list[i].points && list[i].points.length) ws.push(list[i]); }
    if(!ws.length) return;
    if(!woodTile) buildWoodTile();
    var pat=c.createPattern(woodTile,'repeat'); if(!pat) return;
    if(pat.setTransform && typeof DOMMatrix!=='undefined') pat.setTransform(new DOMMatrix().scale(1/WOOD_TS));
    c.save(); c.globalCompositeOperation='source-over'; c.lineCap='round'; c.lineJoin='round';
    c.strokeStyle=pat; c.fillStyle=pat;
    var byW={};                                                       // un seul tracé par largeur → pas de liseré aux recouvrements
    for(i=0;i<ws.length;i++){
      var pts=ws[i].points;
      if(pts.length===1){ c.beginPath(); c.arc(pts[0].x,pts[0].y,ws[i].width/2,0,Math.PI*2); c.fill(); }
      else (byW[ws[i].width]=byW[ws[i].width]||[]).push(pts);
    }
    Object.keys(byW).forEach(function(w){
      c.beginPath();
      byW[w].forEach(function(pts){ c.moveTo(pts[0].x,pts[0].y); for(var k=1;k<pts.length;k++) c.lineTo(pts[k].x,pts[k].y); });
      c.lineWidth=+w; c.stroke();
    });
    c.restore();
  }
  function paintWood(c,o){ woodPass(c,[o]); }

  /* ---- CRAYON : trait d'encre libre, lissé (courbes par les milieux) ---- */
  function pencilWidth(o){ return Math.max(1, (o.width||40)*LINE_W/40); }
  function paintPencil(c,o){
    var pts=o.points; if(!pts||!pts.length) return;
    c.save(); c.globalCompositeOperation='source-over';
    c.lineCap='round'; c.lineJoin='round'; c.strokeStyle=INK_COLOR; c.fillStyle=INK_COLOR; c.lineWidth=pencilWidth(o);
    if(pts.length===1){ c.beginPath(); c.arc(pts[0].x,pts[0].y,pencilWidth(o)/2,0,Math.PI*2); c.fill(); c.restore(); return; }
    c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<pts.length-1;i++){ var mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2; c.quadraticCurveTo(pts[i].x,pts[i].y,mx,my); }
    c.lineTo(pts[pts.length-1].x,pts[pts.length-1].y); c.stroke();
    c.restore();
  }

  /* ---- MUR : bande encre + remplissage + briques éparses (fusion entre murs) ---- */
  function wallThick(o){ return Math.max(8, (o.width||40)*0.4); }
  function wallPath(c,pts){ c.beginPath(); c.moveTo(pts[0].x,pts[0].y); for(var i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y); }
  function wallBricks(c,o){
    var th=wallThick(o), pts=o.points, bh=th*0.30, bl=th*0.62, gap=th*0.08;
    c.lineWidth=LINE_FINE; c.strokeStyle=INK_COLOR; c.fillStyle=BRICK_FILL;
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i], dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy); if(L<1) continue;
      var ang=Math.atan2(dy,dx), step=bl+gap, n=Math.floor((L-th*0.3)/step);
      c.save(); c.translate(a.x,a.y); c.rotate(ang);
      for(var row=0;row<2;row++){                          // deux assises, décalées d'une demi-brique
        var yy=(row===0 ? -bh-gap/2 : gap/2), off=row ? step/2 : 0;
        for(var k=0;k<=n;k++){
          var x=th*0.15+off+k*step; if(x+bl>L-th*0.15) break;
          var sx=a.x+Math.cos(ang)*x, sy=a.y+Math.sin(ang)*x;
          if(seeded(sx*0.37+row*13.1, sy*0.53-row*7.7) > 0.42) continue;   // ÉPARSE : ~40 % des briques
          var jx=(seeded(sx,sy+row)-0.5)*gap*1.5;
          c.beginPath(); c.rect(x+jx, yy, bl, bh); c.fill(); c.stroke();

    }
  }
  /* ombre portée : peinte opaque sur un calque, puis posée en transparence → les ombres qui se croisent ne s'additionnent pas */
  var WALL_SHADOW_ALPHA = 0.26;
  var shadowLayer = document.createElement('canvas'), shadowCtx = shadowLayer.getContext('2d');
  function wallShadows(c,ws){
    var W=c.canvas.width, H=c.canvas.height;
    if(shadowLayer.width!==W || shadowLayer.height!==H){ shadowLayer.width=W; shadowLayer.height=H; }
    shadowCtx.setTransform(1,0,0,1,0,0); shadowCtx.clearRect(0,0,W,H);
    shadowCtx.setTransform(c.getTransform());
    shadowCtx.lineJoin='miter'; shadowCtx.miterLimit=4; shadowCtx.lineCap='square'; shadowCtx.strokeStyle=INK_COLOR;
    for(var i=0;i<ws.length;i++){
      var th=wallThick(ws[i]), off=Math.max(3, th*0.35);              // lumière du haut-gauche → ombre vers le bas-droite
      shadowCtx.save(); shadowCtx.translate(off,off);
      wallPath(shadowCtx,ws[i].points); shadowCtx.lineWidth=th+LINE_W*2; shadowCtx.stroke();
      shadowCtx.restore();
    }
    c.save(); c.setTransform(1,0,0,1,0,0); c.globalAlpha=WALL_SHADOW_ALPHA; c.globalCompositeOperation='source-over';
    c.drawImage(shadowLayer,0,0); c.restore();
  }
  function wallPass(c,list){
    var ws=[], i; for(i=0;i<list.length;i++){ if(list[i].points && list[i].points.length>=2) ws.push(list[i]); }
    if(!ws.length) return;
    wallShadows(c,ws);                                                 // 0) ombres portées, sous tous les murs
    c.save(); c.globalCompositeOperation='source-over'; c.lineJoin='miter'; c.miterLimit=4; c.lineCap='square';
    for(i=0;i<ws.length;i++){ wallPath(c,ws[i].points); c.lineWidth=wallThick(ws[i])+LINE_W*2; c.strokeStyle=INK_COLOR; c.stroke(); }   // tous les contours
    for(i=0;i<ws.length;i++){ wallPath(c,ws[i].points); c.lineWidth=wallThick(ws[i]); c.strokeStyle=PARCHMENT_COLOR; c.stroke(); }        // tous les intérieurs
    for(i=0;i<ws.length;i++){ wallBricks(c,ws[i]); }                                                                                    // briques
    c.restore();
  }
  function paintActive(c,obj){
    if(obj.type==='corridor') paintCorridorPreview(c,obj);
    else if(obj.type==='river') paintRiver(c,obj);
    else if(obj.type==='foliage') paintFoliage(c,obj);
    else if(obj.type==='pencil') paintPencil(c,obj);
    else if(obj.type==='meadow') paintMeadow(c,obj);
    else if(obj.type==='desert') paintDesert(c,obj);
    else if(obj.type==='wood') paintWood(c,obj);
    else if(obj.type==='door') paintDoor(c,obj);
    else if(obj.type==='secret') paintSecret(c,obj);
    else if(obj.type==='stairs') paintStairs(c,obj);
    else if(obj.type==='arrow') paintArrow(c,obj);
  }

  /* ---- rendu de la scène en COUCHES globales ---- */
  function corridorHaloPass(c){
    var i,o; var hp=c.createPattern(hatchTile,'repeat');
    c.globalCompositeOperation='source-over';
    if(hp){ for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='corridor') strokeHalo(c,o,hp); } }
  }
  function corridorBodyPass(c){
    var i,o; c.globalCompositeOperation='source-over';
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='corridor') strokeWalls(c,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='corridor') strokeFloor(c,o); }
  }
  function renderScene(){
    if(scene.width!==canvas.width || scene.height!==canvas.height){ scene.width=canvas.width; scene.height=canvas.height; }
    sctx.setTransform(1,0,0,1,0,0);
    sctx.clearRect(0,0,scene.width,scene.height);
    sctx.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);
    var i,o;
    desertPass(sctx, objects.filter(function(q){ return q.type==='desert'; }));
    meadowPass(sctx, objects.filter(function(q){ return q.type==='meadow'; }));   // sol : sous tout le reste
    woodPass(sctx, objects.filter(function(q){ return q.type==='wood'; }));
    corridorHaloPass(sctx);
    riverPass(sctx, objects.filter(function(q){ return q.type==='river'; }));
    corridorBodyPass(sctx);
    foliagePass(sctx, objects.filter(function(q){ return q.type==='foliage'; }));
    wallPass(sctx, objects.filter(function(q){ return q.type==='wall'; }));
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='stairs') paintStairs(sctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='door') paintDoor(sctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='secret') paintSecret(sctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='pencil') paintPencil(sctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='icon') paintIcon(sctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='svg') paintSvgStamp(sctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='arrow') paintArrow(sctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='text') paintText(sctx,o); }
    sctx.setTransform(1,0,0,1,0,0);
    sceneOx=view.ox; sceneOy=view.oy;
  }
  function paint(active){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(scene, view.ox-sceneOx, view.oy-sceneOy);
    if(active){
      ctx.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);
      paintActive(ctx, active);
      ctx.setTransform(1,0,0,1,0,0);
    }
  }

  /* ---- coordonnées ---- */
  function getScreenPos(e){
    var rect=canvas.getBoundingClientRect();
    var cx,cy;
    if(e.touches && e.touches.length){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
    else if(e.changedTouches && e.changedTouches.length){ cx=e.changedTouches[0].clientX; cy=e.changedTouches[0].clientY; }
    else { cx=e.clientX; cy=e.clientY; }
    return { x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height) };
  }
  function toWorld(s){ return { x:(s.x-view.ox)/view.scale, y:(s.y-view.oy)/view.scale }; }
  function cursorFor(t){ return t==='text' ? 'text' : (t==='icon' || t==='svg') ? 'copy' : t==='eraser' ? 'pointer' : 'crosshair'; }

  /* ---- gomme : distance point→objet, on efface l'objet le plus proche sous le clic ---- */
  function distToSeg(p,a,b){
    var vx=b.x-a.x, vy=b.y-a.y, wx=p.x-a.x, wy=p.y-a.y;
    var c1=vx*wx+vy*wy; if(c1<=0) return Math.hypot(p.x-a.x,p.y-a.y);
    var c2=vx*vx+vy*vy; if(c2<=c1) return Math.hypot(p.x-b.x,p.y-b.y);
    var t=c1/c2; return Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t));
  }
  function distToPolyline(p,pts){
    var d=Infinity; for(var i=0;i<pts.length-1;i++){ d=Math.min(d, distToSeg(p,pts[i],pts[i+1])); }
    if(pts.length===1) d=Math.hypot(p.x-pts[0].x,p.y-pts[0].y);
    return d;
  }
  function hitObject(o,p){
    if(o.type==='wood'){ return distToPolyline(p,o.points) <= o.width/2; }
    if(o.type==='desert'){ return distToPolyline(p,o.points) <= o.width/2; }
    if(o.type==='meadow'){ return distToPolyline(p,o.points) <= o.width/2; }
    if(o.type==='pencil'){ return distToPolyline(p,o.points) <= pencilWidth(o)/2 + 6; }
    if(o.type==='wall'){ return distToPolyline(p,o.points) <= wallThick(o)/2 + 6; }
    if(o.type==='corridor' || o.type==='river' || o.type==='foliage'){ return distToPolyline(p,o.points) <= (o.width/2 + 8); }
    if(o.type==='door' || o.type==='secret' || o.type==='stairs'){ return distToSeg(p,o.a,o.b) <= ((o.width? o.width/2:0) + 20); }
    if(o.type==='arrow'){ return distToSeg(p,o.tip,o.tail) <= 12; }
    if(o.type==='icon'){ return Math.hypot(p.x-o.x, p.y-o.y) <= 22; }
    if(o.type==='svg'){ return Math.abs(p.x-o.x) <= (o.size||40)/2+4 && Math.abs(p.y-o.y) <= (o.size||40)/2+4; }
    if(o.type==='text'){
      var lines=String(o.text).split('\n'); var ml=0; for(var t=0;t<lines.length;t++){ if(lines[t].length>ml) ml=lines[t].length; }
      var bw=ml*11+24, bh=lines.length*22+16;
      return p.x>=o.x-4 && p.x<=o.x+bw+4 && p.y>=o.y-4 && p.y<=o.y+bh+4;
    }
    return false;
  }
  function eraseAt(p){
    for(var i=objects.length-1;i>=0;i--){          // du plus récent (au-dessus) au plus ancien
      if(hitObject(objects[i],p)){ objects.splice(i,1); saveMap(); renderScene(); paint(); return true; }
    }
    return false;
  }

  /* ---- fit + persistance + historique ---- */
  function fitCanvas(){
    var w=Math.max(1,container.clientWidth), h=Math.max(1,container.clientHeight);
    if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
    renderScene(); paint();
  }
  var MAP_LS_KEY='dungeon-editor-map';
  function saveMap(){ try{ localStorage.setItem(MAP_LS_KEY, JSON.stringify({v:1, objects:objects, view:view})); }catch(e){} }
  function loadMap(){ try{ var raw=localStorage.getItem(MAP_LS_KEY); if(!raw) return; var d=JSON.parse(raw); if(d && d.objects){ objects=d.objects; if(d.view && typeof d.view.scale==='number'){ view.scale=d.view.scale; view.ox=d.view.ox; view.oy=d.view.oy; } } }catch(e){} }
  function commit(obj){ objects.push(obj); saveMap(); renderScene(); paint(); }
  function undo(){ if(objects.length){ objects.pop(); saveMap(); renderScene(); paint(); } }
  function clearAll(){ objects.length=0; arrowTip=null; saveMap(); renderScene(); paint(); }

  /* ---- modale ---- */
  var confirmCb=null;
  function showMessage(title,text,isConfirm,onConfirm){
    msgTitle.textContent=title; msgText.textContent=text;
    msgOverlay.style.display='block'; msgBox.style.display='block';
    if(isConfirm){ msgBtnCancel.style.display='inline-flex'; confirmCb=onConfirm||null; }
    else { msgBtnCancel.style.display='none'; confirmCb=null; }
  }
  function hideMessage(){ msgOverlay.style.display='none'; msgBox.style.display='none'; }
  msgBtnOk.addEventListener('click', function(){ hideMessage(); if(confirmCb) confirmCb(); });
  msgBtnCancel.addEventListener('click', hideMessage);
  msgOverlay.addEventListener('click', hideMessage);

  /* ---- texte : champ flottant ---- */
  var activeTextInput=null;
  function removeTextInput(){ if(activeTextInput && activeTextInput.parentNode){ activeTextInput.parentNode.removeChild(activeTextInput); } activeTextInput=null; }
  function openTextInput(e, wp){
    removeTextInput();
    var s=getScreenPos(e);
    var inp=document.createElement('textarea');
    inp.className='map-text-input'; inp.rows=1; inp.wrap='off';
    inp.style.left=s.x+'px'; inp.style.top=s.y+'px';
    inp.style.fontSize=(18*view.scale)+'px';
    container.appendChild(inp); activeTextInput=inp;
    function grow(){ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; inp.style.width='auto'; inp.style.width=(inp.scrollWidth+4)+'px'; }
    setTimeout(function(){ try{ inp.focus(); }catch(err){} grow(); },0);
    var done=false;
    function doCommit(){
      if(done) return; done=true;
      var val=inp.value.trim(); removeTextInput();
      if(val){ commit({type:'text', x:wp.x, y:wp.y, text:val}); }
    }
    inp.addEventListener('input', grow);
    inp.addEventListener('keydown', function(ev){
      ev.stopPropagation();
      if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); doCommit(); }  /* Entrée = valider, Maj+Entrée = nouvelle ligne */
      else if(ev.key==='Escape'){ done=true; removeTextInput(); }
    });
    inp.addEventListener('blur', doCommit);
  }

  /* ---- interaction ---- */
  var drawing=false, curStroke=null, doorA=null;
  var panning=false, panStart=null, panOrig=null;
  var arrowTip=null;

  /* mur en cours : polyligne droite construite clic par clic */
  var wallDraft=null, wallHover=null;
  function wallSnap(p){                       // Maj enfoncée = angle bloqué par pas de 45°
    if(!wallDraft || !wallShift) return p;
    var a=wallDraft.points[wallDraft.points.length-1], dx=p.x-a.x, dy=p.y-a.y;
    var ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4), L=Math.hypot(dx,dy);
    return { x:a.x+Math.cos(ang)*L, y:a.y+Math.sin(ang)*L };
  }
  var wallShift=false, wallEnd=null;
  function wallRender(){
    if(wallDraft){
      var tmp={type:'wall', width:wallDraft.width, points:wallDraft.points.slice()};
      if(wallHover) tmp.points.push(wallHover);
      objects.push(tmp); renderScene(); objects.pop();
      paint();
      // repère du point courant
      ctx.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);
      var last=wallDraft.points[wallDraft.points.length-1];
      ctx.beginPath(); ctx.arc(last.x,last.y,4/view.scale,0,Math.PI*2); ctx.fillStyle=cssVar('--red','#8c2f1f'); ctx.fill();
      ctx.setTransform(1,0,0,1,0,0);
    } else { renderScene(); paint(); }
  }
  function finishWall(){
    if(!wallDraft) return;
    var w=wallDraft; wallDraft=null; wallHover=null;
    var lp=w.points[w.points.length-1]; wallEnd={x:lp.x, y:lp.y, t:performance.now()};
    if(w.points.length>=2) commit(w); else { renderScene(); paint(); }
  }
  var wallRaf=0;
  function onDown(e){
    if(e.button===2 && state.tool==='wall'){ e.preventDefault(); finishWall(); return; }
    if(e.button===1){ e.preventDefault(); panning=true; panStart=getScreenPos(e); panOrig={ox:view.ox,oy:view.oy}; canvas.style.cursor='grabbing'; return; }
    if(e.button===2) return;
    if(activeTextInput) return;
    e.preventDefault();
    var wp=toWorld(getScreenPos(e));
    if(state.tool==='eraser'){ drawing=true; eraseAt(wp); return; }   // clic = efface, glisser = efface en continu
    if(state.tool==='text'){ openTextInput(e, wp); return; }
    if(state.tool==='icon'){ commit({type:'icon', x:wp.x, y:wp.y, emoji:state.icon}); return; }
    if(state.tool==='svg'){ commit({type:'svg', x:wp.x, y:wp.y, key:state.svg, size:state.corridorWidth}); return; }
    if(state.tool==='arrow'){
      if(arrowTip===null){ arrowTip=wp; }
      else { commit({type:'arrow', tip:arrowTip, tail:wp}); arrowTip=null; }
      return;
    }
    if(state.tool==='wall'){
      if(!wallDraft){
        if(wallEnd && performance.now()-wallEnd.t<450 && Math.hypot(wp.x-wallEnd.x, wp.y-wallEnd.y)<10/view.scale) return;   // 2e clic du double-clic de fin : ignoré
        wallDraft={type:'wall', width:state.corridorWidth, points:[wp]}; wallShift=!!e.shiftKey; wallHover=null; wallRender(); return; }
      wallShift=!!e.shiftKey; wp=wallSnap(wp);
      var lp=wallDraft.points[wallDraft.points.length-1];
      if(Math.hypot(wp.x-lp.x, wp.y-lp.y) < 8/view.scale){ finishWall(); return; }   // re-clic au même endroit (double-clic) = fin
      wallDraft.points.push(wp); wallHover=null; wallRender(); return;
    }
    if(state.tool==='door' || state.tool==='secret'){ drawing=true; doorA=wp; return; }
    if(state.tool==='stairs'){ drawing=true; doorA=wp; return; }
    var strokeType=(state.tool==='river')?'river':(state.tool==='foliage')?'foliage':(state.tool==='pencil')?'pencil':(state.tool==='meadow')?'meadow':(state.tool==='desert')?'desert':(state.tool==='wood')?'wood':'corridor';
    drawing=true; curStroke={type:strokeType, points:[wp], width:state.corridorWidth};
  }
  function onMove(e){
    if(panning){ e.preventDefault(); var s=getScreenPos(e); view.ox=panOrig.ox+(s.x-panStart.x); view.oy=panOrig.oy+(s.y-panStart.y); paint(); return; }
    if(state.tool==='arrow' && arrowTip!==null){ paint({type:'arrow', tip:arrowTip, tail:toWorld(getScreenPos(e))}); return; }
    if(state.tool==='wall' && wallDraft){
      wallShift=!!e.shiftKey; wallHover=wallSnap(toWorld(getScreenPos(e)));
      if(!wallRaf) wallRaf=requestAnimationFrame(function(){ wallRaf=0; wallRender(); });
      return;
    }
    if(!drawing) return;
    if(e.cancelable) e.preventDefault();
    var wp=toWorld(getScreenPos(e));
    if(state.tool==='eraser'){ eraseAt(wp); return; }
    if(state.tool==='door'){ paint({type:'door', a:doorA, b:wp}); return; }
    if(state.tool==='secret'){ paint({type:'secret', a:doorA, b:wp}); return; }
    if(state.tool==='stairs'){ paint({type:'stairs', a:doorA, b:wp, width:state.corridorWidth}); return; }
    var last=curStroke.points[curStroke.points.length-1];
    var minStep=(curStroke.type==='pencil' ? 1.5 : 5)/view.scale;     // crayon : échantillonnage fin pour un trait souple
    if(Math.hypot(wp.x-last.x, wp.y-last.y) > minStep){ curStroke.points.push(wp); }
    livePreview();
  }
  /* aperçu FUSIONNÉ pendant le tracé : on rend la scène avec le tracé en cours inclus (1 fois par frame) */
  var liveRaf=0;
  function livePreview(){
    if(liveRaf) return;
    liveRaf=requestAnimationFrame(function(){
      liveRaf=0;
      if(!curStroke){ return; }
      objects.push(curStroke); renderScene(); objects.pop();
      paint();
    });
  }
  function onUp(e){
    if(panning){ panning=false; canvas.style.cursor=cursorFor(state.tool); renderScene(); paint(); return; }
    if(!drawing) return;
    drawing=false;
    if(state.tool==='eraser'){ return; }
    if(state.tool==='door'){ var wp=toWorld(getScreenPos(e)); commit({type:'door', a:doorA, b:wp}); doorA=null; return; }
    if(state.tool==='secret'){ var wps=toWorld(getScreenPos(e)); commit({type:'secret', a:doorA, b:wps}); doorA=null; return; }
    if(state.tool==='stairs'){ var wpt=toWorld(getScreenPos(e)); commit({type:'stairs', a:doorA, b:wpt, width:state.corridorWidth}); doorA=null; return; }
    if(curStroke && (curStroke.type==='foliage' || curStroke.type==='pencil' || curStroke.type==='meadow' || curStroke.type==='desert' || curStroke.type==='wood') && curStroke.points.length>=1){ commit(curStroke); }
    else if(curStroke && curStroke.points.length>=2){ commit(curStroke); } else { renderScene(); paint(); }
    curStroke=null;
  }
  function onWheel(e){
    e.preventDefault();
    var s=getScreenPos(e);
    var wx=(s.x-view.ox)/view.scale, wy=(s.y-view.oy)/view.scale;
    var factor = e.deltaY<0 ? 1.1 : 1/1.1;
    var ns=Math.min(6, Math.max(0.15, view.scale*factor));
    view.scale=ns; view.ox=s.x-wx*ns; view.oy=s.y-wy*ns;
    renderScene(); paint();
  }

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('wheel', onWheel, {passive:false});
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('auxclick', function(e){ if(e.button===1) e.preventDefault(); });
  /* ---- tactile : 1 doigt = outil courant ; 2 doigts = pan + pinch-zoom ---- */
  var pinch=null;
  function touchDist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  function touchMid(t){ var rect=canvas.getBoundingClientRect(); var mx=(t[0].clientX+t[1].clientX)/2, my=(t[0].clientY+t[1].clientY)/2; return { x:(mx-rect.left)*(canvas.width/rect.width), y:(my-rect.top)*(canvas.height/rect.height) }; }
  function onTouchStart(e){
    if(e.touches.length>=2){
      e.preventDefault();
      drawing=false; curStroke=null; doorA=null;   // annule un tracé éventuel
      var mid=touchMid(e.touches);
      pinch={ d0:touchDist(e.touches)||1, s0:view.scale, wx:(mid.x-view.ox)/view.scale, wy:(mid.y-view.oy)/view.scale };
      paint();
      return;
    }
    pinch=null; onDown(e);
  }
  function onTouchMove(e){
    if(pinch && e.touches.length>=2){
      e.preventDefault();
      var mid=touchMid(e.touches), d=touchDist(e.touches);
      var ns=Math.min(6, Math.max(0.15, pinch.s0*(d/pinch.d0)));
      view.scale=ns; view.ox=mid.x-pinch.wx*ns; view.oy=mid.y-pinch.wy*ns;
      renderScene(); paint(); return;
    }
    if(pinch) return;
    onMove(e);
  }
  function onTouchEnd(e){
    if(pinch){ if(e.touches.length<2){ pinch=null; renderScene(); paint(); } return; }
    onUp(e);
  }
  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove', onTouchMove, {passive:false});
  canvas.addEventListener('touchend', onTouchEnd);
  canvas.addEventListener('touchcancel', onTouchEnd);

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && arrowTip!==null){ arrowTip=null; paint(); return; }
    if(wallDraft && (e.key==='Escape' || e.key==='Enter')){ e.preventDefault(); finishWall(); return; }
    if((e.ctrlKey || e.metaKey) && (e.key==='z' || e.key==='Z')){
      e.preventDefault();

    }
  });

  /* ---- outils ---- */
  function setTool(name){
    if(wallDraft && name!=='wall') finishWall();
    state.tool=name; removeTextInput(); arrowTip=null;
    [toolCorridorBtn,toolRiverBtn,toolFoliageBtn,toolDoorBtn,toolSecretBtn,toolStairsBtn,toolTextBtn,toolArrowBtn,toolIconBtn,toolSvgBtn,toolEraserBtn,toolPathBtn,toolNoteBtn,toolWallBtn,toolPencilBtn,toolMeadowBtn,toolDesertBtn,toolWoodBtn].forEach(function(b){ if(b) b.classList.remove('active'); });
    var m={pencil:toolPencilBtn, corridor:toolCorridorBtn, river:toolRiverBtn, foliage:toolFoliageBtn, meadow:toolMeadowBtn, desert:toolDesertBtn, wood:toolWoodBtn, wall:toolWallBtn, door:toolDoorBtn, secret:toolSecretBtn, stairs:toolStairsBtn, text:toolTextBtn, arrow:toolArrowBtn, icon:toolIconBtn, svg:toolSvgBtn, eraser:toolEraserBtn};
    if(m[name]) m[name].classList.add('active');

    });

  }
  widthPicker.addEventListener('input', function(e){ state.corridorWidth=parseInt(e.target.value,10); widthDisplay.textContent=state.corridorWidth; });
  undoBtn.addEventListener('click', undo);
  clearBtn.addEventListener('click', function(){ showMessage("Effacer le parchemin","Voulez-vous jeter ce parchemin au feu ?", true, clearAll); });
  saveBtn.addEventListener('click', exportPNG);

  function closeMenus(except){ [iconMenu, svgMenu, pathMenu, noteMenu].forEach(function(mn){ if(mn && mn!==except) mn.classList.remove('show'); }); }
  function openMenu(btn, menu, mw){

  DROP_GROUPS.forEach(function(g){
    if(!g.btn || !g.menu) return;

  if(toolStairsBtn)   toolStairsBtn.addEventListener('click', function(){ setTool('stairs'); });
  if(toolEraserBtn)   toolEraserBtn.addEventListener('click', function(){ setTool('eraser'); });
  if(toolTextBtn)     toolTextBtn.addEventListener('click', function(){ setTool('text'); });
  if(toolArrowBtn)    toolArrowBtn.addEventListener('click', function(){ setTool('arrow'); });
  if(toolIconBtn) toolIconBtn.addEventListener('click', function(e){
    e.stopPropagation();

    iconMenu.style.top=(r.bottom+6)+'px';
    iconMenu.style.maxHeight=(window.innerHeight-r.bottom-16)+'px';
    iconMenu.classList.add('show');

  if(iconMenu){
    iconMenu.addEventListener('click', function(e){ e.stopPropagation(); });
    var ibtns=iconMenu.querySelectorAll('[data-emoji]');
    for(var q=0;q<ibtns.length;q++){
      (function(b){

  /* ---- menu des pictogrammes SVG (construit depuis SVG_STAMPS) ---- */
  function setSvgStamp(key){
    state.svg=key;
    if(toolSvgBtn){ var cs=toolSvgBtn.querySelector('.cur-svg'); if(cs) cs.innerHTML=stampMarkup(key); }
  }
  if(svgMenu){
    var cats={}, order=[];
    Object.keys(SVG_STAMPS).forEach(function(k){ var c=SVG_STAMPS[k].cat||'Divers'; if(!cats[c]){ cats[c]=[]; order.push(c); } cats[c].push(k); });
    order.forEach(function(c){

  }
  if(toolSvgBtn) toolSvgBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(!svgMenu) return;
    closeMenus(svgMenu);
    if(svgMenu.classList.contains('show')){ svgMenu.classList.remove('show'); return; }
    var r=toolSvgBtn.getBoundingClientRect();
    var mw=Math.min(340, window.innerWidth*0.92);
    svgMenu.style.left=Math.max(8, Math.min(r.left, window.innerWidth-mw-8))+'px';
    svgMenu.style.top=(r.bottom+6)+'px';
    svgMenu.style.maxHeight=(window.innerHeight-r.bottom-16)+'px';
    svgMenu.classList.add('show');
  });
  document.addEventListener('click', function(){ closeMenus(null); });
  setTool('corridor');

  /* ---- export PNG (toute la carte, à l'échelle 1) ---- */
  function contentBounds(){
    if(!objects.length) return {minX:0,minY:0,w:800,h:600};
    var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    function ext(x,y,r){ r=r||0; if(x-r<minX)minX=x-r; if(y-r<minY)minY=y-r; if(x+r>maxX)maxX=x+r; if(y+r>maxY)maxY=y+r; }
    for(var i=0;i<objects.length;i++){
      var o=objects[i];
      if(o.type==='corridor'){ var r=o.width/2+INK_THICKNESS+HATCH_BAND+4; for(var k=0;k<o.points.length;k++){ ext(o.points[k].x,o.points[k].y,r); } }
      else if(o.type==='river'){ var rr=o.width/2+6; for(var kr=0;kr<o.points.length;kr++){ ext(o.points[kr].x,o.points[kr].y,rr); } }
      else if(o.type==='wood'){ var rwd=o.width/2+2; for(var kwd=0;kwd<o.points.length;kwd++){ ext(o.points[kwd].x,o.points[kwd].y,rwd); } }
      else if(o.type==='desert'){ var rd=o.width/2+2; for(var kd=0;kd<o.points.length;kd++){ ext(o.points[kd].x,o.points[kd].y,rd); } }
      else if(o.type==='meadow'){ var rm=o.width/2+4; for(var km=0;km<o.points.length;km++){ ext(o.points[km].x,o.points[km].y-18,rm); ext(o.points[km].x+6,o.points[km].y,rm); } }
      else if(o.type==='pencil'){ var rp=pencilWidth(o)/2+4; for(var kp=0;kp<o.points.length;kp++){ ext(o.points[kp].x,o.points[kp].y,rp); } }
      else if(o.type==='wall'){ var rw=wallThick(o)*0.85+8; for(var kw=0;kw<o.points.length;kw++){ ext(o.points[kw].x,o.points[kw].y,rw); } }
      else if(o.type==='foliage'){ var rf=o.width/2+4; for(var kf=0;kf<o.points.length;kf++){ ext(o.points[kf].x,o.points[kf].y,rf); } }
      else if(o.type==='door' || o.type==='secret'){ ext(o.a.x,o.a.y,30); ext(o.b.x,o.b.y,30); }
      else if(o.type==='stairs'){ var sr=(o.width||40); ext(o.a.x,o.a.y,sr); ext(o.b.x,o.b.y,sr); }
      else if(o.type==='arrow'){ ext(o.tip.x,o.tip.y,18); ext(o.tail.x,o.tail.y,18); }
      else if(o.type==='text'){ var tl=String(o.text).split('\n'); var ml=0; for(var tt=0;tt<tl.length;tt++){ if(tl[tt].length>ml) ml=tl[tt].length; } ext(o.x,o.y,6); ext(o.x+ml*12+24, o.y+tl.length*22+18, 6); }
      else if(o.type==='icon'){ ext(o.x,o.y,20); }
      else if(o.type==='svg'){ ext(o.x,o.y,(o.size||40)/2+4); }
    }
    return {minX:minX, minY:minY, w:Math.max(1,maxX-minX), h:Math.max(1,maxY-minY)};
  }
  function exportPNG(){
    try{
      var b=contentBounds(), pad=40;
      var tmp=document.createElement('canvas');
      tmp.width=Math.round(b.w+pad*2); tmp.height=Math.round(b.h+pad*2);
      var tctx=tmp.getContext('2d');
      tctx.setTransform(1,0,0,1, pad-b.minX, pad-b.minY);
      var i,o;
      desertPass(tctx, objects.filter(function(q){ return q.type==='desert'; }));
    meadowPass(tctx, objects.filter(function(q){ return q.type==='meadow'; }));   // sol : sous tout le reste
    woodPass(tctx, objects.filter(function(q){ return q.type==='wood'; }));
    corridorHaloPass(tctx);
      riverPass(tctx, objects.filter(function(q){ return q.type==='river'; }));
      corridorBodyPass(tctx);
      foliagePass(tctx, objects.filter(function(q){ return q.type==='foliage'; }));
    wallPass(tctx, objects.filter(function(q){ return q.type==='wall'; }));
      for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='stairs') paintStairs(tctx,o); }
      for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='door') paintDoor(tctx,o); }
      for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='secret') paintSecret(tctx,o); }
      for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='pencil') paintPencil(tctx,o); }
    for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='icon') paintIcon(tctx,o); }
      for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='svg') paintSvgStamp(tctx,o); }
      for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='arrow') paintArrow(tctx,o); }
      for(i=0;i<objects.length;i++){ o=objects[i]; if(o.type==='text') paintText(tctx,o); }
      tctx.setTransform(1,0,0,1,0,0);
      tctx.globalCompositeOperation='destination-over';               // fond parchemin glissé sous tout le dessin
      tctx.fillStyle=PARCHMENT_COLOR; tctx.fillRect(0,0,tmp.width,tmp.height);
      tctx.globalCompositeOperation='source-over';
      var link=document.createElement('a');
      link.download='donjon-osr.png'; link.href=tmp.toDataURL('image/png');
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }catch(err){ showMessage("Erreur","Impossible d'exporter l'image. "+err.message, false, null); }
  }

  /* ---- init autonome ---- */
  function boot(){ if(!initialized){ initialized=true; loadMap(); } fitCanvas(); }
  window.addEventListener('resize', function(){ fitCanvas(); });
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); }
  else { boot(); }
})();

</script>
